name: iOS Build (Capacitor)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-ios:
    name: Build iOS (simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Ensure Capacitor CLI and iOS platform
        run: |
          npm install --no-save @capacitor/cli@^8 @capacitor/ios@^8

      - name: Sync iOS project
        run: npx @capacitor/cli sync ios

      - name: Build iOS app (simulator)
        run: |
          cd ios/App
          xcodebuild clean -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator
          xcodebuild build -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 14,OS=latest'

      - name: Upload built .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ios/App/**/Build/Products/**/*.app
